# Sem receptor: tráfego da API pública e ecos de chuva da RainViewer.
#   radClock -c config.api.toml
[display]
fullscreen = false
backlight = ""          # no PC, não mexer no brilho do monitor/notebook

[source]
kind = "api"

[api]
provider = "adsb.lol"

[echo]
enabled = true

[weather]
icao = "SBSJ"         # METAR real de São José dos Campos (NOAA AWC)

[network]
strict_tls = false    # rede corporativa: proxy TLS com CA sem Authority Key Identifier

# mapa de São José dos Campos (maps/, gerado por tools/make_map.py --geojson-dir)
[[map.layers]]
path = "maps/rivers.geojson"
color = "#2E4A66"

[[map.layers]]
path = "maps/coastline.geojson"
color = "#D8C878"

[[map.layers]]
path = "maps/states.geojson"
color = "#6E6640"

[[map.layers]]
path = "maps/centerlines.geojson"
color = "#4A5A50"
max_range_km = 50

[[map.layers]]
path = "maps/runways.geojson"
color = "#C8C8C8"
max_range_km = 100

[[map.layers]]
path = "maps/airports.geojson"
color = "#C8C8C8"
label_range_km = 100

[[map.layers]]
path = "maps/navaids.geojson"
color = "#8FA0C8"
max_range_km = 200
label_range_km = 100
