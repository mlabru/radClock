# Desenvolvimento no PC, com tools/fake_readsb.py gerando o tráfego.
[display]
fullscreen = false
backlight = ""          # no PC, não mexer no brilho do monitor/notebook

[source]
path = "/tmp/radClock/aircraft.json"

# mapa de São José dos Campos (maps/, gerado por tools/make_map.py --geojson-dir)
[[map.layers]]
path = "maps/rivers.geojson"
color = "#2E4A66"

[[map.layers]]
path = "maps/coastline.geojson"
color = "#D8C878"

[[map.layers]]
path = "maps/states.geojson"
color = "#6E6640"

[[map.layers]]
path = "maps/centerlines.geojson"
color = "#4A5A50"
max_range_km = 50

[[map.layers]]
path = "maps/runways.geojson"
color = "#C8C8C8"
max_range_km = 100

[[map.layers]]
path = "maps/airports.geojson"
color = "#C8C8C8"
label_range_km = 100

[[map.layers]]
path = "maps/navaids.geojson"
color = "#8FA0C8"
max_range_km = 200
label_range_km = 100

[weather]
icao = "SBSJ"         # METAR real de São José dos Campos (NOAA AWC)
