# Watchdog de hardware do Raspberry Pi (bcm2835_wdt), alimentado pelo systemd.
# Se o kernel ou o próprio systemd travar, o chip reinicia o Pi sozinho.
# Instalar em /etc/systemd/system.conf.d/watchdog.conf e reiniciar.
[Manager]
# o bcm2835_wdt aceita no máximo ~15 s
RuntimeWatchdogSec=15
# reboot travado no meio: força depois de 2 min
RebootWatchdogSec=2min
