# Log do sistema em uso 24/7 num cartão SD: limita o tamanho no cartão.
# Instalar em /etc/systemd/journald.conf.d/radclock.conf e
# `sudo systemctl restart systemd-journald`. Com o overlay FS ligado o log já
# fica só na RAM e isto só limita o uso de memória.
[Journal]
SystemMaxUse=50M
RuntimeMaxUse=30M
